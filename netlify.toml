[build]
  command = "npm run build"
  publish = "dist/lais-pwa/browser"

[build.environment]
  NODE_VERSION = "20"

# App de página única: qualquer rota (/login, /painel, /campanhas/1...) abre o index.html.
# Arquivos que existem de verdade (js, css, imagens, manifest) continuam sendo servidos normalmente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O PWA precisa ver sempre a versão mais nova destes arquivos para avisar sobre atualizações.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
