<div class="login">
  <span class="orb orb--1"></span>
  <span class="orb orb--2"></span>

  <form class="card login__card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login__brand">
      <span class="login__mark">L</span>
      <h1>Lais Platform</h1>
      <p>Gestão, governança e CRO</p>
    </div>

    <label class="field">
      <span>Usuário</span>
      <input formControlName="username" autocomplete="username" autocapitalize="none" />
    </label>

    <label class="field">
      <span>Senha</span>
      <input formControlName="password" type="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="login__error" role="alert">{{ error() }}</p>
    }

    <button class="btn btn--gold" type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</div>
